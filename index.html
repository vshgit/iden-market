<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Демо Айден Маркета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: role strip on top, then one column per role — storefront (wide grid), seller cabinet (narrow, phone-first), back office (sidebar + table area). Tokens mirror the «Айден Маркет — дизайн-система». */
:root{
  --bg:#FFFFFF; --surface:#F5F4F2; --surface-raised:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#48484C; --ink-3:#6B6B70;
  --line:#ECEBE8; --line-strong:#DCDAD6;
  --accent:#1E5B47; --on-accent:#FFFFFF; --accent-ink:#1E5B47; --accent-soft:#EEF4F1;
  --photo-soft:#E8EDF3; --photo-ink:#2F4257; --declared-line:#8E8E93;
  --warn-soft:#FFF4E5; --warn-ink:#9A5B13; --defect:#C2410C;
  --danger:#B42318; --danger-soft:#FDECEA; --info-soft:#EEF1F6;
  --strip:#1D1D1F; --strip-ink:#F2F1EE; --strip-ink-2:#A9A8A4;
  --shadow-pop:0 8px 28px rgba(0,0,0,0.10);
  --plate:#FFFFFF;
  --font:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:14px; --r-xl:20px; --r-2xl:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141414; --surface:#1F1F1E; --surface-raised:#262625;
  --ink:#F2F1EE; --ink-2:#C8C7C3; --ink-3:#9B9A96;
  --line:#2C2C2A; --line-strong:#45453F;
  --accent:#2E7A60; --on-accent:#FFFFFF; --accent-ink:#7CC8AA; --accent-soft:#1A2C25;
  --photo-soft:#1D2631; --photo-ink:#AFC2D8; --declared-line:#7A7A7F;
  --warn-soft:#2E2416; --warn-ink:#E6B26E; --defect:#F08A5D;
  --danger:#F2836F; --danger-soft:#33191A; --info-soft:#1C222B;
  --strip:#000000; --strip-ink:#F2F1EE; --strip-ink-2:#9B9A96;
  --shadow-pop:0 8px 28px rgba(0,0,0,0.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1F1F1E; --surface-raised:#262625;
  --ink:#F2F1EE; --ink-2:#C8C7C3; --ink-3:#9B9A96;
  --line:#2C2C2A; --line-strong:#45453F;
  --accent:#2E7A60; --on-accent:#FFFFFF; --accent-ink:#7CC8AA; --accent-soft:#1A2C25;
  --photo-soft:#1D2631; --photo-ink:#AFC2D8; --declared-line:#7A7A7F;
  --warn-soft:#2E2416; --warn-ink:#E6B26E; --defect:#F08A5D;
  --danger:#F2836F; --danger-soft:#33191A; --info-soft:#1C222B;
  --strip:#000000; --strip-ink:#F2F1EE; --strip-ink-2:#9B9A96;
  --shadow-pop:0 8px 28px rgba(0,0,0,0.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--strip)}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-0.02em}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:720px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}.gap32{gap:32px}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sb{justify-content:space-between}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* role strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--strip);color:var(--strip-ink)}
.strip .wrap{display:flex;align-items:center;gap:10px;min-height:48px;flex-wrap:wrap;padding-block:6px}
.strip .tag{font-size:12px;color:var(--strip-ink-2);white-space:nowrap}
.roles{display:flex;background:rgba(255,255,255,0.10);border-radius:999px;padding:3px}
.roles button{border:0;background:transparent;color:var(--strip-ink);font-size:13px;font-weight:500;height:30px;padding:0 12px;border-radius:999px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--strip-ink);color:var(--strip)}
.strip .sbtn{border:1px solid rgba(255,255,255,0.22);background:transparent;color:var(--strip-ink);height:32px;padding:0 12px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.strip .sbtn.icon{width:32px;padding:0;justify-content:center}
.strip .sp{flex:1}
.strip .prog{font-size:12px;color:var(--strip-ink-2)}
@media (max-width:640px){ .strip .tag{display:none} .roles button{padding:0 9px;font-size:12.5px} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-md);border:0;font-size:15px;font-weight:600;white-space:nowrap;text-align:center}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.xs{height:32px;padding:0 11px;font-size:13px;border-radius:9px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface);color:var(--ink)}
.btn.out{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.dng{background:transparent;color:var(--danger);border:1px solid var(--line-strong)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icobtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.icobtn .cnt{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.link{color:var(--accent-ink);font-weight:500;background:none;border:0;padding:0}

/* badges & pills */
.b{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;font-size:12.5px;font-weight:500;white-space:nowrap;align-self:flex-start}
.b.l0{border:1.5px dashed var(--declared-line);border-radius:999px;color:var(--ink-2)}
.b.l1{background:var(--photo-soft);color:var(--photo-ink);border-radius:var(--r-sm)}
.b.l2{background:var(--accent);color:var(--on-accent);border-radius:999px;font-weight:600;padding-left:8px}
.b.lg{height:32px;font-size:13.5px;padding:0 13px}
.b.lg.l2{padding-left:9px}
.soft{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:600;align-self:flex-start;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:3px;display:inline-block}
.pill.info{background:var(--info-soft)}.pill.info i{background:var(--photo-ink)}
.pill.ok{background:var(--accent-soft)}.pill.ok i{background:var(--accent-ink)}
.pill.warn{background:var(--warn-soft)}.pill.warn i{background:var(--warn-ink)}
.pill.err{background:var(--danger-soft)}.pill.err i{background:var(--danger)}
.pill.neu{background:var(--surface)}.pill.neu i{background:var(--ink-3)}

/* notices */
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink-2);border-radius:var(--r-lg);padding:12px 14px}
.note b{color:var(--ink);font-weight:600}
.note svg{flex:0 0 20px;margin-top:1px}
.note.safe{background:var(--accent-soft)}.note.safe svg{stroke:var(--accent-ink)}
.note.warn{background:var(--warn-soft)}.note.warn svg{stroke:var(--warn-ink)}
.note.err{background:var(--danger-soft)}.note.err svg{stroke:var(--danger)}
.note.info{background:var(--info-soft)}.note.info svg{stroke:var(--photo-ink)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:92px;min-height:56px;padding:8px 14px;border-radius:var(--r-lg);border:1px solid var(--line-strong);background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;text-align:left}
.opt b{font-size:15px;font-weight:600}
.opt span{font-size:12px;color:var(--ink-3)}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:7px 13px}
.opt.off{opacity:.45}
.radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid var(--line-strong);background:var(--bg);text-align:left;width:100%}
.radio .dot{flex:0 0 18px;height:18px;border-radius:9px;border:1.5px solid var(--ink-3)}
.radio[aria-pressed="true"]{border:2px solid var(--ink);padding:11px 13px}
.radio[aria-pressed="true"] .dot{border:5px solid var(--ink)}
.radio .t{font-size:14.5px;font-weight:600}
.radio .s{font-size:12.5px;color:var(--ink-3)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.inp{height:48px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--bg);padding:0 14px;font-size:15px;width:100%}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.5}
select.inp{appearance:auto}
.inp:focus{outline:2px solid var(--accent-ink);outline-offset:0;border-color:transparent}
.hint{font-size:12.5px;color:var(--ink-3)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:0 0 20px}
.toggle{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line-strong);border:0;flex:0 0 44px;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:21px}

/* storefront header */
.shead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.shead .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-0.02em;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.search{flex:1;max-width:560px;position:relative}
.search input{height:44px;border-radius:999px;border:0;background:var(--surface);padding:0 16px 0 42px;width:100%;font-size:15px}
.search svg{position:absolute;left:14px;top:12px;color:var(--ink-3)}
.navl{display:flex;gap:4px;margin-left:auto}
.catnav{display:flex;gap:22px;font-size:14px;color:var(--ink-2)}
.catnav a:hover{color:var(--ink)}
@media (max-width:820px){ .catnav{display:none} }
@media (max-width:560px){ .shead .search{display:none} .shead .msearch{display:inline-flex!important} }
.msearch{display:none!important}

/* sections */
.page{padding-block:24px 64px;display:flex;flex-direction:column;gap:40px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec h2{font-size:22px;line-height:1.25;font-weight:600}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.h1{font-size:32px;line-height:1.18;font-weight:700}
@media (max-width:560px){ .h1{font-size:25px} .page{gap:32px} }

.banner{border-radius:var(--r-2xl);background:var(--accent);color:var(--on-accent);padding:28px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;overflow:hidden;position:relative}
.banner h2{font-size:30px;line-height:1.1;font-weight:700;max-width:520px}
.banner p{opacity:.88;font-size:15px;margin-top:6px;max-width:520px}
.banner .when{font-size:12.5px;opacity:.8;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.banner .btn{background:var(--on-accent);color:#1E5B47;margin-left:auto}
@media (max-width:560px){ .banner{padding:22px 20px} .banner h2{font-size:24px} .banner .btn{margin-left:0} }

.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cat{background:var(--surface);border-radius:var(--r-xl);padding:8px 8px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cat .plate{height:150px;border-radius:16px}
.cat .plate img{max-height:80%}
.cat > div{padding:0 6px}
.cat b{font-size:16px}
.cat span{font-size:12.5px;color:var(--ink-3)}
.cat .plate{position:relative}
.stackph{position:absolute;right:10px;bottom:10px;display:flex;padding-left:10px}
.stackph .ph{width:30px;height:30px;border-radius:9px;border:2px solid var(--plate);margin-left:-9px;box-sizing:content-box}
@media (max-width:820px){ .cats{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))} .cat .plate{height:120px} }
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trust > div{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-xl);border:1px solid var(--line)}
.trust svg{flex:0 0 24px;color:var(--accent-ink)}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:13px;color:var(--ink-3)}
@media (max-width:820px){ .trust{grid-template-columns:1fr} }
.trust.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){ .trust.duo{grid-template-columns:1fr} }

/* photo sprite */
.ph{background-color:var(--surface);background-repeat:no-repeat;background-size:cover;border-radius:var(--r-xl);display:block}

/* lot grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 16px}
@media (max-width:560px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px} }
.card{display:flex;flex-direction:column;gap:7px;min-width:0;position:relative}
.card .ph{aspect-ratio:1/1;width:100%;max-width:100%}
.card .pr{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .pr s{font-size:13px;font-weight:400;color:var(--ink-3)}
.card .t{font-size:14px;line-height:1.35}
.card .m{font-size:12.5px;color:var(--ink-3)}
.card .fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:18px;background:var(--surface-raised);border:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.card .fav[aria-pressed="true"] svg{fill:var(--defect);stroke:var(--defect)}
.card .new{position:absolute;top:8px;left:8px;background:var(--surface-raised);border-radius:999px;font-size:11.5px;font-weight:600;height:24px;padding:0 9px;display:flex;align-items:center}
.empty{padding:32px;border-radius:var(--r-xl);background:var(--surface);text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}

/* model grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:8px}
.mcard .ph{aspect-ratio:1/1}
.mcard b{font-size:15.5px}
.mcard span{font-size:13px;color:var(--ink-3)}
@media (max-width:560px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* two-column page */
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:900px){ .two{grid-template-columns:minmax(0,1fr);gap:28px} }
.two > *,.qgrid > *{min-width:0}
.side{position:sticky;top:132px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){ .side{position:static} }

/* gallery */
.gal{display:flex;flex-direction:column;gap:12px}
.gal .main{position:relative;aspect-ratio:1/1;width:100%;max-width:100%}
.gal .main .ph{width:100%;height:100%;border-radius:var(--r-2xl)}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:0;background:var(--surface-raised);box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.gal .nav.p{left:12px}.gal .nav.n{right:12px}
.gal .cnt{position:absolute;right:14px;bottom:14px;background:var(--surface-raised);border-radius:8px;padding:3px 8px;font-size:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.thumbs button{flex:0 0 64px;height:64px;border:2px solid transparent;border-radius:14px;padding:0;background:none}
.thumbs button .ph{width:100%;height:100%;border-radius:11px}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.tiles > div{background:var(--surface);border-radius:var(--r-lg);padding:12px}
.tiles dt{font-size:12px;color:var(--ink-3)}
.tiles dd{margin:3px 0 0;font-size:14px;font-weight:600}
@media (max-width:560px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.price{font-size:34px;font-weight:700;letter-spacing:-0.02em}
.box{border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:12px}
.seller{display:flex;align-items:center;gap:12px}
.ava{flex:0 0 40px;height:40px;border-radius:11px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.ava.acc{background:var(--accent);color:var(--on-accent)}
.defect{display:flex;gap:12px;padding:12px;border-radius:var(--r-lg);background:var(--surface);font-size:14px}
.dn{flex:0 0 22px;height:22px;border-radius:11px;border:2px solid var(--defect);color:var(--defect);background:var(--bg);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-ink)}
.bar.low i{background:var(--warn-ink)}
.okl{list-style:none;margin:0;padding:0;font-size:14px}
.okl li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.okl svg{color:var(--accent-ink);flex:0 0 17px}
.rep li{padding:10px 0;border-top:1px solid var(--line);list-style:none}
.rep{margin:0;padding:0}
.sticky-buy{display:none}
@media (max-width:900px){
  .sticky-buy{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;gap:8px;background:var(--surface-raised);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .sticky-buy .btn{flex:1}

function vSign() {
  const q = S.lots.filter((l) => l.status === 'signing').sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0));
  if (!q.length) return '<h1 class="h1" style="font-size:28px">Подпись проверки</h1><div class="empty"><b>Отчётов на подпись нет</b><span style="font-size:14px">Сюда попадают лоты после физической проверки инспектором: поставки FBI и аппараты FBS, принесённые на проверку.</span></div>';
  const l = q.find((x) => x.id === UI.signId) || q[0]; UI.signId = l.id;
  UI.chk = UI.chk || {}; const c = l.claim || { bat: l.bat, grade: l.grade, parts: [] };
  const k = UI.chk[l.id] || (UI.chk[l.id] = { bat: c.bat, grade: c.grade || null, imei: true, locks: true, func: true });
  const isNewO = !c.grade;
  const rows = [
    ['Модель и память', [l.model, memLabel(l.mem), l.color].filter(Boolean).join(', '), '<span class="okflag">' + I.ok + 'совпадает</span>', false],
    ['IMEI', '••••' + l.imei, '<span class="okflag">' + I.ok + 'совпадает на лотке и в настройках</span>', false],
    ['Блокировки', 'Локатор, Apple ID, MDM — нет', '<span class="okflag">' + I.ok + 'подтверждено</span>', false],
    ['Функции, 38 пунктов', 'Всё работает', '<span class="okflag">' + I.ok + '38 из 38</span>', false]
  ];
  if (!isNewO) {
    rows.push(['Батарея', c.bat ? c.bat + '%' : '—', '<input class="inp num" style="height:38px;width:96px" id="kbat" inputmode="numeric" data-in="kbat" value="' + esc(k.bat == null ? '' : k.bat) + '" aria-label="Батарея по проверке, %"> %', +k.bat !== +c.bat]);
    rows.push(['Замены деталей', (l.repl && l.repl.length) ? l.repl.join(', ') : 'нет', '<span class="okflag">' + I.ok + '«История деталей» сходится</span>', false]);
    rows.push(['Дефекты', l.defects.length ? l.defects.join('; ') : 'нет', '<span class="okflag">' + I.ok + 'отмечены на фото</span>', false]);
    rows.push(['Грейд', c.grade, '<select class="inp" style="height:38px;width:auto" id="kgrade" data-ch="kgrade" aria-label="Грейд по проверке">' + GRADES.map((g) => '<option' + (k.grade === g ? ' selected' : '') + '>' + g + '</option>').join('') + '</select>', k.grade !== c.grade]);
  }
  const changed = rows.some((r) => r[3]);
  return '<div class="row sb wrapr gap12"><h1 class="h1" style="font-size:28px">Подпись проверки</h1><span class="muted num" style="font-size:13px">' + q.length + ' на подпись</span></div>' +
    '<div class="qgrid"><div class="stack gap8">' + q.map((x) => '<button type="button" class="qitem" data-a="sq" data-v="' + x.id + '" aria-pressed="' + (x.id === l.id) + '">' + ph(x, 0) + '<span class="grow stack gap4" style="min-width:0"><span style="font-size:14px;font-weight:600;line-height:1.3">' + esc(shortTitle(x)) + '</span><span class="muted" style="font-size:12.5px">' + esc(seller(x.seller).short) + ' · ' + (x.ful === 'FBI' ? 'приёмка FBI' : 'проверка FBS, пломба') + '</span>' + (x.mine ? '<span class="soft" style="height:22px;font-size:11.5px">Ваш лот из сценария</span>' : '') + '</span></button>').join('') + '</div>' +
    '<section class="stack gap16"><div class="row gap12">' + ph(l, 0, '', null, 'flex:0 0 72px;height:72px;border-radius:14px') + '<div class="stack gap4"><h2 style="font-size:20px">' + esc(shortTitle(l)) + '</h2><span class="muted" style="font-size:13.5px">' + esc(seller(l.seller).short) + ' · чек-лист iPhone v1 · инспектор: Илья Р.</span></div></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Пункт</th><th>Продавец заявил</th><th>Проверка показала</th></tr></thead><tbody>' + rows.map((r) => '<tr' + (r[3] ? ' class="diff"' : '') + '><td>' + r[0] + '</td><td>' + esc(r[1]) + '</td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div>' +
    (changed ? '<div class="note warn">' + I.info + '<span><b>Есть расхождения с заявленным.</b> Продавец увидит исправления и согласует грейд и цену. В демо он соглашается сразу.</span></div>' : '') +
    (l.ful === 'FBS' ? '<div class="field" style="max-width:320px"><label for="seal">Номер пломбы</label><input class="inp num" id="seal" value="' + l.imei + '-' + String(S.seq.report + 1).slice(-3) + '"></div>' : '') +
    '<div class="row gap8 wrapr"><button type="button" class="btn pri" data-a="sign" data-v="' + l.id + '">' + I.seal + (changed ? 'Подписать с правками' : 'Подписать отчёт') + '</button><button type="button" class="btn dng" data-a="signrej" data-v="' + l.id + '">Отклонить</button></div>' +
    '<div class="note info">' + I.info + '<span>Подпись неизменяема: хэш отчёта, проверяющий, дата и версия чек-листа. Имя проверяющего видно только здесь, покупатель видит бейдж, дату и номер отчёта. Подпись можно только отозвать с причиной.</span></div></section></div>';
}
A.sq = (v) => { UI.signId = v; render(); };
IN.kbat = (v) => { UI.chk[UI.signId].bat = v.replace(/\D/g, '').slice(0, 3); render(); };
CH.kgrade = (v) => { UI.chk[UI.signId].grade = v; render(); };
A.sign = (id) => {
  const l = lotById(id); const k = (UI.chk || {})[id] || {}; const c = l.claim || {};
  const fixes = [];
  if (k.bat != null && k.bat !== '' && +k.bat !== +c.bat) { fixes.push('АКБ ' + c.bat + '% → ' + k.bat + '%'); l.bat = +k.bat; }
  if (k.grade && k.grade !== c.grade) { fixes.push('грейд «' + c.grade + '» → «' + k.grade + '»'); l.grade = k.grade; }
  if (fixes.length) l.fixed = fixes.join(', ');
  S.seq.report += 1; l.report = String(S.seq.report).padStart(6, '0'); l.trust = 2; l.checked = nowIso(); l.signer = 'Айден';
  publish(l); UI.signId = null;
  toast('Отчёт № ' + l.report + ' подписан. ' + (l.status === 'live' ? 'Лот на витрине' : 'Лот выйдет ' + fmtDT(l.when)), l.status === 'live' ? ['Открыть витрину', '', 'buyer'] : null);
  render();
};
A.signrej = (id) => { const l = lotById(id); l.status = 'rejected'; l.rejectReason = 'Не прошёл физическую проверку'; UI.signId = null; toast('Проверка отклонена, продавец получил причину'); render(); };

/* ---- campaigns ---- */
function vCamps() {
  const c = S.campaigns.find((x) => x.id === UI.camp) || S.campaigns[0]; UI.camp = c.id;
  const n = live().filter((l) => l.camp === c.id).length;
  const sched = S.lots.filter((l) => l.status === 'scheduled');
  return '<div class="row sb wrapr gap12"><h1 class="h1" style="font-size:28px">Кампании</h1><button type="button" class="btn sec sm" data-a="cnew">' + I.plus + 'Новая кампания</button></div>' +
    '<div class="chips">' + S.campaigns.map((x) => '<button type="button" class="chip" data-a="cpick" data-v="' + x.id + '" aria-pressed="' + (x.id === c.id) + '">' + esc(x.title) + (x.active ? ' · активна' : '') + '</button>').join('') + '</div>' +
    '<div class="qgrid" style="grid-template-columns:minmax(0,420px) minmax(0,1fr)"><form class="stack gap12" data-sub="noop">' +
    '<div class="field"><label for="ctitle">Название</label><input class="inp" id="ctitle" data-in="cf" data-v="title" value="' + esc(c.title) + '"></div>' +
    '<div class="field"><label for="ctag">Метка на баннере</label><input class="inp" id="ctag" data-in="cf" data-v="tag" value="' + esc(c.tag || '') + '" placeholder="до −15%"></div>' + '<div class="field"><label for="csub">Текст баннера</label><textarea class="inp" id="csub" data-in="cf" data-v="sub" style="min-height:84px">' + esc(c.sub) + '</textarea></div>' +
    '<div class="row gap12"><div class="field grow"><label for="cfrom">Начало</label><input class="inp num" type="date" id="cfrom" data-in="cf" data-v="from" value="' + esc(c.from) + '"></div><div class="field grow"><label for="cto">Конец</label><input class="inp num" type="date" id="cto" data-in="cf" data-v="to" value="' + esc(c.to) + '"></div></div>' +
    '<div class="row sb" style="padding:8px 0"><span style="font-size:14.5px;font-weight:500">Показывать на главной</span><button type="button" class="toggle" data-a="cact" data-v="' + c.id + '" aria-pressed="' + !!c.active + '" aria-label="Кампания активна"></button></div>' +
    '<span class="hint num">Лотов-участников: ' + n + '. Продавцы отмечают их сами в кабинете.</span></form>' +
    '<div class="stack gap12"><span class="lbl">Баннер на главной</span><section class="banner" style="padding:22px 24px"><div class="stack gap4 grow"><span class="when">' + esc(dRange(c)) + '</span><h2 style="font-size:24px">' + esc(c.title) + '</h2><p>' + esc(c.sub) + '</p></div>' + (c.tag ? '<span class="btag">' + esc(c.tag) + '</span>' : '') + '</section><span class="hint">На телефоне баннер сжимается до одной строки: название, даты и метка.</span><a class="link" style="font-size:14px" href="#">Посмотреть на витрине</a>' +
    '<span class="lbl" style="margin-top:12px">Запланированные публикации</span>' + (sched.length ? '<div class="list">' + sched.map((l) => '<div class="li">' + ph(l, 0) + '<div class="grow stack gap4"><span class="t">' + esc(shortTitle(l)) + '</span><span class="s">' + esc(seller(l.seller).short) + ' · ' + fmtDT(l.when) + '</span></div></div>').join('') + '</div>' : '<span class="muted" style="font-size:14px">Нет. Продавец задаёт время публикации в мастере лота — так партия выходит к ролику или старту акции.</span>') + '</div></div>';
}
A.cpick = (v) => { UI.camp = v; render(); };
A.cnew = () => { const id = 'c' + (S.campaigns.length + 1); S.campaigns.push({ id, title: 'Новая кампания', sub: 'Короткий текст для баннера', from: '2026-12-15', to: '2026-12-31', active: false }); UI.camp = id; render(); };
A.cact = (id) => { const c = S.campaigns.find((x) => x.id === id); const on = !c.active; S.campaigns.forEach((x) => { x.active = false; }); c.active = on; toast(on ? 'Баннер «' + c.title + '» на главной' : 'Баннер снят с главной'); render(); };
A.noop = () => {};
IN.cf = (v, el) => { const c = S.campaigns.find((x) => x.id === UI.camp); c[el.dataset.v] = v; later(); };

/* ---- sellers ---- */
function vSellers() {
  const pend = S.sellers.filter((s) => s.status === 'pending');
  const act = S.sellers.filter((s) => s.status !== 'pending' && s.status !== 'declined');
  const live_ = live();
  return '<h1 class="h1" style="font-size:28px">Продавцы</h1>' +
    (pend.length ? '<section class="sec"><h2>Заявки</h2>' + pend.map((s) => '<div class="box"><div class="row sb wrapr gap12"><div class="stack gap4"><b style="font-size:16px">' + esc(s.short) + ' · ' + esc(s.legal) + '</b><span class="muted num" style="font-size:13px">ИНН ' + esc(s.inn) + ' · ' + esc(s.exp) + '</span></div><span class="pill info"><i></i>Новая заявка</span></div>' +
      '<ul class="okl">' + ['Данные подтянуты из ЕГРИП, ИП действующий', 'Подтверждение через Госуслуги', 'Реквизиты счёта проверены', 'Оферта подписана'].map((c) => '<li>' + I.ok + c + '</li>').join('') + '</ul>' +
      '<div class="row gap8 wrapr"><button type="button" class="btn pri sm" data-a="sapp" data-v="' + esc(s.name) + '|active">Допустить</button><button type="button" class="btn dng sm" data-a="sapp" data-v="' + esc(s.name) + '|declined">Отклонить</button></div><span class="hint">Только ИП и ООО — самозанятые не могут перепродавать товары (289-ФЗ).</span></div>').join('') + '</section>' : '') +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Продавец</th><th>Статус</th><th class="r">Рейтинг</th><th class="r">Успешных</th><th class="r">Точность</th><th class="r">Лотов</th><th>FBI</th><th>Прямые расчёты</th><th></th></tr></thead><tbody>' +
    act.map((s) => { const n = live_.filter((l) => l.seller === s.name).length; const blk = s.status === 'blocking';
      return '<tr><td><div class="stack"><b style="font-size:14px">' + esc(s.short) + '</b><span class="muted" style="font-size:12px">' + esc(s.legal) + '</span></div></td><td>' + (blk ? '<span class="pill err"><i></i>Блокировка ' + fmtD(s.blockAt) + '</span>' : (s.sales < 10 ? '<span class="pill neu"><i></i>Новый</span>' : '<span class="pill ok"><i></i>Активен</span>')) + '</td>' +
        '<td class="r num">' + (s.rating ? String(s.rating).replace('.', ',') : '—') + '</td><td class="r num">' + (s.success ? s.success + '%' : '—') + '</td><td class="r num">' + (s.acc ? s.acc + '%' : '—') + '</td><td class="r num">' + n + '</td>' +
        '<td><button type="button" class="toggle" data-a="sflag" data-v="' + esc(s.name) + '|fbi" aria-pressed="' + !!s.fbi + '" aria-label="FBI для ' + esc(s.short) + '"></button></td><td><button type="button" class="toggle" data-a="sflag" data-v="' + esc(s.name) + '|direct" aria-pressed="' + !!s.direct + '" aria-label="Прямые расчёты для ' + esc(s.short) + '"></button></td>' +
        '<td>' + (s.name.indexOf('Айден') === 0 ? '' : (blk ? '<button type="button" class="btn out xs" data-a="sblock" data-v="' + esc(s.name) + '">Отменить</button>' : '<button type="button" class="btn dng xs" data-a="sblock" data-v="' + esc(s.name) + '">Заблокировать</button>')) + '</td></tr>'; }).join('') +
    '</tbody></table></div><span class="hint">Блокировка — только по основаниям из оферты и с уведомлением продавца за 3 дня (289-ФЗ). Изменение комиссий — за 45 дней.</span>';
}
A.sapp = (v) => { const [n, st] = v.split('|'); const s = S.sellers.find((x) => x.name === n); s.status = st; if (st === 'active') { s.rating = null; s.sales = 0; } toast(st === 'active' ? 'Продавец допущен, доступ к кабинету открыт' : 'Заявка отклонена'); render(); };
A.sflag = (v) => { const [n, k] = v.split('|'); const s = S.sellers.find((x) => x.name === n); s[k] = !s[k]; render(); };
A.sblock = (n) => { const s = S.sellers.find((x) => x.name === n); if (s.status === 'blocking') { s.status = 'active'; toast('Блокировка отменена'); } else { s.status = 'blocking'; s.blockAt = new Date(Date.now() + 3 * 86400e3).toISOString(); toast('Продавец уведомлён: блокировка через 3 дня'); } render(); };

/* ===== boot ===== */
S = load();
if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
render();

})();
</script>
</body>
</html>
